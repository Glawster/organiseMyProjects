name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Check Python formatting
        run: black --check --diff .

      - name: Run Ruff
        run: ruff check .

      - name: Run OMP Python linter
        run: runLinter .

      - name: Validate agent readiness
        run: manageProject --check
